<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Debug Firma Nueva — 3 trazos</title>
<style>
  *{ box-sizing:border-box; }
  body{ margin:0; background:#000; color:#fff; font-family:monospace; display:flex; height:100vh; }
  #left{ flex:1; display:flex; flex-direction:column; min-width:0; }
  #panel{ background:rgba(0,0,0,.95); padding:1rem; border-bottom:1px solid #E91E8C; }
  #panel input{ width:100%; margin:.5rem 0; accent-color:#E91E8C; }
  #panel label{ font-size:.8rem; color:#aaa; }
  #panel .val{ color:#E91E8C; font-weight:bold; }
  #panel .big{ font-size:1.2rem; }
  button{ background:#E91E8C; color:#fff; border:none; padding:.4rem 1rem; border-radius:4px; cursor:pointer; font-size:.8rem; margin-right:.3rem; }
  button.small{ padding:.2rem .6rem; font-size:.7rem; }
  svg{ width:100%; flex:1; display:block; }
  #sidebar{ width:300px; background:#111; border-left:1px solid #E91E8C; padding:1rem; overflow-y:auto; font-size:.75rem; }
  #sidebar h3{ color:#E91E8C; margin-top:0; font-size:.9rem; }
  #timeline{ list-style:none; padding:0; }
  #timeline li{ padding:.4rem .5rem; margin:.2rem 0; border-left:3px solid #333; transition:all .3s; cursor:pointer; }
  #timeline li:hover{ background:rgba(233,30,99,.05); }
  #timeline li.active{ border-left-color:#E91E8C; color:#E91E8C; background:rgba(233,30,99,.2); font-weight:bold; }
  #timeline li.done{ border-left-color:#555; color:#666; }
  #timeline .pct{ float:right; font-size:.65rem; color:#888; }
  #info{ font-size:.7rem; color:#666; margin-top:1rem; border-top:1px solid #333; padding-top:.5rem; }
</style>
</head>
<body>
<div id="left">
  <div id="panel">
    <label>Progreso: <span class="val big" id="prog">0.000</span> | Trazo activo: <span class="val big" id="curSeg">—</span></label>
    <input type="range" id="slider" min="0" max="1000" value="0" step="1">
    <button onclick="play()">▶ Play (20s)</button>
    <button onclick="pause()">⏸ Pause</button>
    <button onclick="reset()">↺ Reset</button>
    <button class="small" onclick="playSeg(0)">Solo trazo 1</button>
    <button class="small" onclick="playSeg(1)">Solo trazo 2</button>
    <button class="small" onclick="playSeg(2)">Solo trazo 3</button>
  </div>
  <svg viewBox="0 0 3125 2604.17" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
    <path class="seg" id="seg0" d="M423.25 2245.48c89.77,-131.12 179.54,-262.25 278.89,-430.19 99.35,-167.94 208.29,-372.69 278.39,-500.29 70.1,-127.59 101.37,-178.02 132.63,-228.46" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="seg" id="seg1" d="M1107.12 1086.55c21.18,30.26 42.36,60.52 63.54,104.4 21.18,43.87 42.37,101.37 71.62,169.95 29.25,68.59 66.57,148.27 114.48,208.79 47.91,60.52 106.41,101.87 157.35,121.04 50.93,19.17 94.31,16.14 139.19,-1.01 44.89,-17.15 91.28,-48.41 132.13,-89.26 40.85,-40.85 76.15,-91.28 106.92,-161.39 30.76,-70.1 56.99,-159.87 80.19,-258.21 23.2,-98.34 43.37,-205.26 45.39,-290.99 2.02,-85.74 -14.12,-150.29 -40.34,-202.24 -26.22,-51.94 -62.54,-91.28 -105.91,-119.02 -43.37,-27.74 -93.8,-43.88 -147.26,-50.94 -53.46,-7.06 -109.94,-5.04 -189.62,19.67 -79.69,24.71 -182.57,72.12 -279.9,141.21 -97.33,69.09 -189.12,159.87 -263.26,242.07 -74.14,82.2 -130.62,155.84 -181.56,262.25 -50.94,106.41 -96.33,245.61 -127.09,369.17 -30.76,123.56 -46.9,231.48 -52.95,320.75 -6.05,89.27 -2.02,159.87 16.64,210.3 18.66,50.43 51.94,80.69 85.74,96.83 33.79,16.14 68.08,18.16 109.94,2.02 41.86,-16.14 91.28,-50.43 165.92,-163.91 74.64,-113.47 174.5,-306.12 274.35,-498.78" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  </svg>
</div>
<div id="sidebar">
  <h3>🧭 3 Trazos — firmanueva.svg</h3>
  <p style="color:#888;font-size:.7rem;">Click en un trazo para saltar a él</p>
  <ul id="timeline">
    <li data-seg="0"><span class="pct" id="pct0">--</span> Trazo 1 — Inicio / base de la firma</li>
    <li data-seg="1"><span class="pct" id="pct1">--</span> Trazo 2 — Cuerpo principal (el más largo)</li>
    <li data-seg="2"><span class="pct" id="pct2">--</span> Trazo 3 — Floritura y remate final</li>
  </ul>
  <div id="info">
    Longitud total: <span id="totalLen">—</span><br>
    Trazos: 3 independientes con pausas
  </div>
</div>
<script>
  const segs = document.querySelectorAll('.seg');
  const slider = document.getElementById('slider');
  const items = document.querySelectorAll('#timeline li');
  let lengths = [];
  let totalLen = 0;
  let animId = null;

  setTimeout(() => {
    segs.forEach((s, i) => {
      const len = s.getTotalLength();
      lengths.push(len);
      totalLen += len;
      s.setAttribute('stroke-dasharray', len);
      s.setAttribute('stroke-dashoffset', len);
      document.getElementById('pct' + i).textContent = Math.round(len) + ' px';
    });
    document.getElementById('totalLen').textContent = Math.round(totalLen) + ' px';
    console.log('Trazos:', lengths.map(l => Math.round(l)));
  }, 300);

  // Timeline with pauses between strokes: 0-20% trace 1, 25-70% trace 2, 75-100% trace 3
  const timeline = [
    { start: 0.00, end: 0.20 },
    { start: 0.25, end: 0.70 },
    { start: 0.75, end: 1.00 },
  ];

  function update(p) {
    document.getElementById('prog').textContent = p.toFixed(3);
    let activeSeg = -1;
    segs.forEach((s, i) => {
      const t = timeline[i];
      const localP = Math.max(0, Math.min(1, (p - t.start) / (t.end - t.start)));
      const eased = 1 - Math.pow(1 - localP, 2.5);
      const off = lengths[i] * (1 - eased);
      if (p >= t.end) off = 0;
      s.setAttribute('stroke-dashoffset', off);
      if (p >= t.start && p < t.end) activeSeg = i;
    });
    document.getElementById('curSeg').textContent = activeSeg >= 0 ? 'Trazo ' + (activeSeg + 1) : (p >= 1 ? '✓ Completo' : '⏳ Pausa');
    items.forEach((li, i) => {
      li.className = p >= timeline[i].end ? 'done' : (i === activeSeg ? 'active' : '');
    });
  }

  slider.oninput = () => update(slider.value / 1000);

  items.forEach(li => {
    li.onclick = () => {
      const i = parseInt(li.dataset.seg);
      slider.value = Math.round(timeline[i].start * 1000);
      update(timeline[i].start);
    };
  });

  function playSeg(n) {
    pause();
    slider.value = Math.round(timeline[n].start * 1000);
    update(timeline[n].start);
    play();
  }

  function play() {
    if (animId) return;
    let p = parseFloat(slider.value) / 1000;
    const start = performance.now(), startVal = p;
    function tick(now) {
      p = Math.min(1, startVal + (now - start) / 20000);
      slider.value = Math.round(p * 1000);
      update(p);
      if (p < 1) animId = requestAnimationFrame(tick);
      else animId = null;
    }
    animId = requestAnimationFrame(tick);
  }
  function pause() { if (animId) { cancelAnimationFrame(animId); animId = null; } }
  function reset() { pause(); slider.value = 0; update(0); }
</script>
</body>
</html>
